# One-click deploy on Render: https://render.com/deploy (Blueprint)
services:
  - type: web
    name: agritech
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI        # paste your MongoDB Atlas connection string in the Render dashboard
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
